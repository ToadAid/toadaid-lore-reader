name: Public Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages recommends allowing an active production deployment to finish.
# The shared group still skips obsolete queued runs and prevents deployment races.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: sync, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Reader
        uses: actions/checkout@v6
      - name: Checkout canonical lore repository
        uses: actions/checkout@v6
        with:
          repository: ToadAid/toadaid.github.io
          path: canonical-lore
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sync canonical main through P2R2
        run: npm run sync:canonical -- --canonical-repo "$GITHUB_WORKSPACE/canonical-lore"
      - name: Validate Reader
        run: npm test
      - name: Build Pages project site
        env:
          PUBLIC_SITE: https://toadaid.github.io
          PUBLIC_BASE: /toadaid-lore-reader/
        run: npm run build
      - name: Validate Pages artifact
        run: node scripts/validate-public-build.mjs --dir dist --base /toadaid-lore-reader/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
